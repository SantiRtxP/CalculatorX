<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Calculadora de Presupuesto</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>📊 Mi Presupuesto</h1>
        
        <div class="form-group">
            <label for="ingresos">💰 Ingresos Mensuales ($):</label>
            <input type="number" id="ingresos" placeholder="Ej. 1500" min="0">
        </div>

        <div class="form-group">
            <label for="gastos">📉 Gastos Fijos ($):</label>
            <input type="number" id="gastos" placeholder="Ej. 800" min="0">
        </div>

        <button onclick="calcularPresupuesto()">Calcular Balance</button>

        <div id="resultado" class="result-box hidden">
            <h3>Resultado:</h3>
            <p id="mensaje-balance"></p>
            <p id="mensaje-ahorro"></p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
